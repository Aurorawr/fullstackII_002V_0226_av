<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demostración bootstrap</title>

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body class="bg-secondary-subtle">

                Column
            </div>
            <div class="col">
                Column
            </div>

                Column
            </div>
        </div>
        <div class="row">

                </div>
                <div class="toast-body">
                    Guau guau!
                </div>
            </div>
            
        </div>
        <p class="text-success border border-primary text-center fs-1">Hola buenas</p>
